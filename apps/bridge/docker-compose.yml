version: '3.8'

services:
  toland-bridge:
    build:
      context: ../..
      dockerfile: apps/bridge/Dockerfile
    container_name: toland-bridge
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WHATSAPP_BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_SESSION_ID=default
      - WHATSAPP_CLOUD_API_TOKEN=${WHATSAPP_CLOUD_API_TOKEN:-}
      - WHATSAPP_CLOUD_API_PHONE_NUMBER_ID=${WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
