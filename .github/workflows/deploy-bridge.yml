name: Deploy WhatsApp Bridge

on:
  push:
    branches:
      - main
    paths:
      - 'apps/bridge/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-bridge.yml'
  pull_request:
    paths:
      - 'apps/bridge/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-bridge.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        run: |
          docker build -t toland-bridge:${{ github.sha }} -f apps/bridge/Dockerfile .
